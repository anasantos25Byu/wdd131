<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página de avaliação de produtos que permite selecionar um produto, atribuir uma classificação, registrar comentários e enviar sua avaliação.">
    <meta name="author" content="Ana Suely Côrtes Santos">

    <title>Formulário de Avaliação</title>

    <link rel="stylesheet" href="estilos/formulario.css">
    <script src="scripts/formulario.js" defer></script>
</head>

<body>

<header>
    <h1>Avaliação de Produto</h1>
</header>

<main>
<form method="get" action="avaliacao.html">

    <!-- Select com placeholder -->
    <div class="campo">
        <label for="produto">Nome do produto *</label>
        <select id="produto" name="produto" required>
            <option value="" disabled selected hidden>Selecione um produto...</option>
        </select>
    </div>

    <!-- Radios dentro de fieldset -->
    <fieldset class="campo">
        <legend>Classificação Geral *</legend>

        <label for="estrela1">
            <input type="radio" id="estrela1" name="classificacao" value="1" required> ★☆☆☆☆
        </label>

        <label for="estrela2">
            <input type="radio" id="estrela2" name="classificacao" value="2" required> ★★☆☆☆
        </label>

        <label for="estrela3">
            <input type="radio" id="estrela3" name="classificacao" value="3" required> ★★★☆☆
        </label>

        <label for="estrela4">
            <input type="radio" id="estrela4" name="classificacao" value="4" required> ★★★★☆
        </label>

        <label for="estrela5">
            <input type="radio" id="estrela5" name="classificacao" value="5" required> ★★★★★
        </label>
    </fieldset>

    <!-- Data -->
    <div class="campo">
        <label for="data">Data de Instalação *</label>
        <input type="date" id="data" name="data" required>
    </div>

    <!-- Checkboxes com label for -->
    <div class="campo">
        <p>Recursos úteis</p>

        <label for="durabilidade">
            <input type="checkbox" id="durabilidade" name="recursos" value="Durabilidade"> Durabilidade
        </label>

        <label for="desempenho">
            <input type="checkbox" id="desempenho" name="recursos" value="Desempenho"> Desempenho
        </label>

        <label for="design">
            <input type="checkbox" id="design" name="recursos" value="Design"> Design
        </label>

        <label for="facilidade">
            <input type="checkbox" id="facilidade" name="recursos" value="Facilidade de Uso"> Facilidade de Uso
        </label>
    </div>

    <!-- Textarea -->
    <div class="campo">
        <label for="avaliacao">Avaliação Escrita</label>
        <textarea id="avaliacao" name="avaliacao" rows="5"></textarea>
    </div>

    <!-- Nome de usuário -->
    <div class="campo">
        <label for="usuario">Nome de Usuário</label>
        <input type="text" id="usuario" name="usuario">
    </div>

    <!-- Botão -->
    <input type="submit" value="Enviar Avaliação" class="botao">

</form>
</main>

<footer>
    <p>© <span id="ano">2026</span> | Ana Suely Côrtes Santos | Brasil</p>
    <p id="ultimaModificacao"></p>
</footer>

</body>
</html>
