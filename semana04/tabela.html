<!DOCTYPE html>
<html lang="pt-en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabela de Comparação</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        padding: 20px;
    }

    table {
        width: 80%;
        margin: auto;
        border-collapse: collapse;
        background-color: white;
    }

    caption {
        font-size: 1.2em;
        font-weight: bold;
        margin-bottom: 10px;
        color: #2c3e50;
    }

    th {
        background-color: #3498db;
        color: white;
        padding: 12px;
        border: 1px solid #ddd;
    }

    td {
        padding: 12px;
        border: 1px solid #ddd;
        text-align: center;
    }

    /* Listras de zebra */
    tbody tr:nth-child(even) {
        background-color: #f2f2f2;
    }

    tbody tr:hover {
        background-color: #d6eaf8;
    }
</style>
</head>
<body>

<table>
    <caption>Tabela 1: Comparação de Recursos da Conta</caption>

    <thead>
        <tr>
            <th>Recurso</th>
            <th>Conta Básica</th>
            <th>Conta Premium</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>Suporte ao Cliente</td>
            <td>✔️</td>
            <td>✔️</td>
        </tr>
        <tr>
            <td>Armazenamento em Nuvem</td>
            <td>❌</td>
            <td>✔️</td>
        </tr>
        <tr>
            <td>Relatórios Avançados</td>
            <td>❌</td>
            <td>✔️</td>
        </tr>
        <tr>
            <td>Acesso Multidispositivo</td>
            <td>✔️</td>
            <td>✔️</td>
        </tr>
        <tr>
            <td>Backup Automático</td>
            <td>❌</td>
            <td>✔️</td>
        </tr>
    </tbody>
</table>

</body>
</html>
